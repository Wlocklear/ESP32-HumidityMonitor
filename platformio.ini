; ══════════════════════════════════════════════════
;  Humidity Monitor — ESP32-S3 only.
;
;  Two AHT30 sensors both sit at the fixed I2C address 0x38, so each needs
;  its own bus. The S3 is the only board here with two full hardware I2C
;  controllers; the ESP32-C6's second bus is the pin-restricted LP_I2C.
;  See the header comment in src/main.cpp.
; ══════════════════════════════════════════════════

[platformio]
default_envs = esp32s3

[env]
framework    = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.1
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA@3.1.7

; ── ESP32-S3-DevKitC — USB (first flash) ────────
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ── ESP32-S3-DevKitC — OTA ──────────────────────
[env:esp32s3-ota]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags =
    -DCORE_DEBUG_LEVEL=3
upload_protocol = espota
; OTA by mDNS name: set to this unit's device name + .local
upload_port = humiditymonitor.local
